name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docx-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check docs/docx-editor.js
          node --check docs/word-docx.js
          node --check docs/pdf-support.js
          node --check docs/experimental-signal.js
          node --check docs/experimental-signal-ui.js
          node --check docs/simple-ui.js
          node --check docs/ai-score-ui.js
          node --check docs/app.js
          node --check tests/studio-insights-browser.test.js
          node --check docs/browser-ai-runtime.js
          node --check docs/ai-evidence-core.js
          node --check tests/ai-evidence-core.test.js
          node --check tests/browser-ai-engine.test.js
          node --check tests/browser-ai-ui.test.js
          node --check tests/simple-ui-browser.test.js
          node --check docs/vendor/jszip.min.js
          node --check tests/word-docx.test.js
      - name: Install test XML parser
        run: npm install --no-save --no-package-lock --ignore-scripts --save-exact @xmldom/xmldom@0.9.12 puppeteer-core@25.13.0
      - name: Static privacy and CSP checks
        run: node tests/security-static.test.js
      - name: Detector evaluation framework tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Bilingual writing engine tests
        run: |
          node --check docs/writing-rules.js
          node --check docs/writing-lab.js
          node tests/writing-rules.test.js
      - name: Word DOCX safe-clean integration tests
        run: |
          node tests/word-docx.test.js
          node tests/docx-editor.test.js
      - name: Real browser Word workflow smoke test
        run: |
          node --check tests/browser-smoke.test.js
          node tests/browser-smoke.test.js
      - name: Simplified front page progressive disclosure regression
        run: node tests/simple-ui-browser.test.js
      - name: Privacy-safe bilingual editorial insights and real-model heatmap contracts
        run: |
          node --check docs/studio-insights-core.js
          node tests/studio-insights-core.test.js
      - name: Editor studio, accessibility, privacy and heatmap browser regression
        env:
          TIS_SCREENSHOT_DIR: /tmp/tis-ui-screenshots
        run: |
          node --check docs/studio-insights-ui.js
          node tests/studio-insights-browser.test.js
      - name: Focused scan-AI editor and visible diagnostic regression
        run: |
          node --check tests/scan-ai-workflow.test.cjs
          node tests/scan-ai-workflow.test.cjs
      - name: Approved one-click editor layout, self-hosted fonts and model truthfulness
        env:
          TIS_SCREENSHOT_DIR: /tmp/tis-ui-screenshots
        run: |
          node --check tests/approved-v5-one-click.test.cjs
          node tests/approved-v5-one-click.test.cjs
      - name: Token-aware detector validation, coverage and disagreement safeguards
        run: node tests/ai-evidence-core.test.js
      - name: Real research model adapter rules (no fake numbers)
        run: node tests/browser-ai-engine.test.js
      - name: Real browser AI score opt-in and UI regression
        env:
          TIS_SCREENSHOT_DIR: /tmp/tis-ui-screenshots
        run: node tests/browser-ai-ui.test.js
      - name: Real Chrome PDF.js parsing, privacy and responsive workflow
        run: |
          test -s docs/vendor/pdfjs/pdf.mjs
          test -s docs/vendor/pdfjs/pdf.worker.mjs
          node --check tests/pdf-browser.test.js
          node tests/pdf-browser.test.js
      - name: Local optional AI research model checks
        run: |
          node tests/experimental-signal.test.js
          node tests/signal-browser.test.js
      - name: Offline scanned-PDF OCR using vendored Tesseract
        timeout-minutes: 3
        run: |
          test -s docs/vendor/tesseract/lang/eng.traineddata.gz
          test -s docs/vendor/tesseract/worker.min.js
          node --check tests/ocr-browser.test.js
          node tests/ocr-browser.test.js

      - name: Collect real desktop/mobile interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-workspace-screenshots
          path: /tmp/tis-ui-screenshots/*.png
          retention-days: 3
          if-no-files-found: ignore

  approved-font-assets:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/approved-one-click-editor-v5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approved-one-click-editor-v5
      - name: Download and pin OFL fonts to source revision
        shell: bash
        run: |
          set -euo pipefail
          if test -s docs/fonts/Manrope-variable.ttf && test -s docs/fonts/IBMPlexSansArabic-Regular.ttf && test -s docs/fonts/IBMPlexSansArabic-Bold.ttf; then
            echo "Pinned font binaries already present"; exit 0
          fi
          mkdir -p docs/fonts
          base="https://raw.githubusercontent.com/google/fonts/66928797f271fed5ee428544e7229685e2d90127/ofl"
          curl -fLSs --retry 3 "$base/manrope/Manrope%5Bwght%5D.ttf" -o docs/fonts/Manrope-variable.ttf
          curl -fLSs --retry 3 "$base/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf" -o docs/fonts/IBMPlexSansArabic-Regular.ttf
          curl -fLSs --retry 3 "$base/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf" -o docs/fonts/IBMPlexSansArabic-Bold.ttf
          curl -fLSs --retry 3 "$base/manrope/OFL.txt" -o docs/fonts/MANROPE-OFL.txt
          curl -fLSs --retry 3 "$base/ibmplexsansarabic/OFL.txt" -o docs/fonts/IBM-PLEX-ARABIC-OFL.txt
          test "$(git hash-object docs/fonts/Manrope-variable.ttf)" = "75274da58537d6123b14f2cd0c355ad4681fc2b3"
          test "$(git hash-object docs/fonts/IBMPlexSansArabic-Regular.ttf)" = "e779068718b9801b809605b2bf3067121cce524c"
          test "$(git hash-object docs/fonts/IBMPlexSansArabic-Bold.ttf)" = "211ff62d8d1778bff69a1b3a906b2ad1686564bc"
          test "$(git hash-object docs/fonts/MANROPE-OFL.txt)" = "e271172a9ed0cddc895aabb6509f1c7d880b492d"
          test "$(git hash-object docs/fonts/IBM-PLEX-ARABIC-OFL.txt)" = "c35c4c618fab33da8695177b3a6cefe0810b7b28"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fonts/
          git commit -m "assets: self-host licensed Manrope and IBM Plex Sans Arabic"
          git push origin HEAD:feature/approved-one-click-editor-v5
