name: Measured public corpus detector pilot (research only)
on:
  workflow_dispatch:
  push:
    branches: [feature/deep-model-consensus-token-coverage]
    paths:
      - '.github/workflows/public-detector-pilot.yml'
permissions:
  contents: read
jobs:
  public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only public dataset and browser inference dependencies
        run: |
          python -m pip install 'huggingface_hub>=0.35,<2'
          npm install --no-save --no-package-lock --ignore-scripts --save-exact puppeteer-core@25.13.0
      - name: Prepare prompt-group held-out public authorship claims (NOT verified labels)
        run: |
          cd backend
          python -m hybrid_detector.baseline_data --source hc3_en --out /tmp/tis-benchmark --limit 1000
      - name: Infer real TMR ONNX signals for up to 24 human + 24 ChatGPT English samples
        env:
          TIS_PUBLIC_WEAK_CORPUS: /tmp/tis-benchmark/hc3_en.jsonl
          TIS_BENCH_RESULTS: /tmp/tis-benchmark/model-predictions.jsonl
        run: |
          node tests/browser-ai-reference-benchmark.cjs
      - name: Compute held-out counts, Wilson false-positive bounds, AUC and calibration error
        run: |
          python backend/research/evaluate_model_outputs.py \
            --samples /tmp/tis-benchmark/model-predictions.jsonl \
            --output /tmp/tis-benchmark/eval-report.json \
            --model-revision b9aa251e5bcda7e429fcc936767d921435945b60 \
            --benchmark HC3_PUBLIC_WEAK_LABELS
      - name: Publish METRICS ONLY (no source text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-weak-label-model-evaluation
          path: /tmp/tis-benchmark/eval-report.json
          retention-days: 7
          if-no-files-found: ignore
