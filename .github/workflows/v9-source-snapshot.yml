name: V9 branch source snapshot (temporary)
on:
  push:
    branches:
      - feature/v9-simplified-workspace
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test harness dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --save-exact @xmldom/xmldom@0.9.12 puppeteer-core@25.13.0
      - name: Create reproducible test snapshot
        run: tar -czf /tmp/tis-v9-source.tar.gz --exclude=.git -C "$GITHUB_WORKSPACE" .
      - uses: actions/upload-artifact@v4
        with:
          name: tis-v9-source-snapshot
          path: /tmp/tis-v9-source.tar.gz
          retention-days: 1
          if-no-files-found: error
