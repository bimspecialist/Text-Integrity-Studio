name: V9 branch source snapshot (temporary)
on:
  push:
    branches:
      - feature/v9-simplified-workspace
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create testable source archive
        run: tar -czf /tmp/tis-v9-source.tar.gz --exclude=.git -C "$GITHUB_WORKSPACE" .
      - uses: actions/upload-artifact@v4
        with:
          name: tis-v9-source-snapshot
          path: /tmp/tis-v9-source.tar.gz
          retention-days: 1
          if-no-files-found: error
