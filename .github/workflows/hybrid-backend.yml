name: Hybrid detector backend checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/hybrid-backend.yml'
  push:
    branches: [main, 'feature/**']
    paths:
      - 'backend/**'
      - '.github/workflows/hybrid-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded backend and calibration test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile service modules
        run: python -m compileall -q backend/hybrid_detector
      - name: Test privacy, bilingual NLP, calibration gates and HTTP contract
        run: PYTHONPATH=backend python -m pytest backend/tests -q -ra
      - name: Audit third-party dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --disable-pip --strict
