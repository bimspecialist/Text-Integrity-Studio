name: V12 unified preview — real Chromium and safety gates
on:
  push:
    branches: [feature/v12-unified-review-workspace, fix/v12-audit-acceptance]
  pull_request:
    paths:
      - 'docs/analysis/workspace-v12.*'
      - 'docs/analysis/workspace-v10.js'
      - 'docs/analysis/app-adapter.js'
      - 'docs/analysis/workspace-v11-guided.js'
      - 'docs/index.html'
      - 'tests/analysis/workspace-v12-*.test.cjs'
      - 'docs/quality/v12-contrast-followup-20261027.md'
      - '.github/workflows/v12-unified-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA tools
        run: npm install --no-save --no-package-lock --ignore-scripts --save-exact puppeteer-core@25.13.0 axe-core@4.10.3 @xmldom/xmldom@0.9.12
      - name: Validate syntax and existing research score safety
        run: |
          node --check docs/analysis/workspace-v12.js
          node --check tests/analysis/workspace-v12-browser.test.cjs
          node tests/analysis/workspace-v11-signal-presentation.test.cjs
          node tests/analysis/analysis-controller.test.js
      - name: V12 Chrome responsive writing and explicit model entry
        env:
          TIS_V12_SCREENSHOTS: /tmp/tis-v12-qa
        run: node tests/analysis/workspace-v12-browser.test.cjs
      - name: V12 tested Undo visibility and no stale source advice
        run: node tests/analysis/workspace-v12-editor-recovery-browser.test.cjs
      - name: V12 EN AR axe-core input, writing guidance and dual editor
        run: node tests/analysis/workspace-v12-axe-browser.test.cjs
      - name: Diagnose real V12 contrast incomplete cases before visual sign-off
        run: node tests/analysis/workspace-v12-contrast-diagnostic.test.cjs
      - name: Retain V11 reviewed edit/undo and long-file coverage
        run: |
          node tests/analysis/workspace-v11-m2-reviewed-edits-browser.test.cjs
          node tests/analysis/workspace-v11-file-review-browser.test.cjs
      - name: Keep V9 default and V11 website QA working
        run: node tests/analysis/v11-online-preview-browser.test.cjs
      - name: Release marker integrity
        run: node tests/analysis/public-postdeploy-contract.test.cjs
      - name: Upload real Chromium visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-unified-review-screenshots
          path: /tmp/tis-v12-qa/*.png
          retention-days: 4
          if-no-files-found: ignore
      - name: V12 completed synthetic result and navigation regression
        run: node tests/analysis/workspace-v12-results-browser.test.cjs
      - name: V12 writing runtime guard negative control
        run: node tests/analysis/workspace-v12-network-guard.test.cjs
      - name: V12 workflow path and test selection regression
        run: node tests/analysis/workspace-v12-workflow-paths.test.cjs
