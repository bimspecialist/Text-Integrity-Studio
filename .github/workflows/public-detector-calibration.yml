name: Public weak-label calibration study (not production)
on:
  workflow_dispatch:
  push:
    branches: [feature/deep-model-consensus-token-coverage]
    paths:
      - '.github/workflows/public-detector-calibration.yml'
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public dataset and local model-evaluation dependencies
        run: |
          python -m pip install 'huggingface_hub>=0.35,<2'
          npm install --no-save --no-package-lock --ignore-scripts --save-exact puppeteer-core@25.13.0
      - name: Freeze and prepare research corpus with group-disjoint splits
        run: |
          cd backend
          python -m hybrid_detector.baseline_data --source hc3_en --out /tmp/tis-calibration --limit 1400
      - name: Run actual ONNX model on disjoint CALIBRATION and TEST author-labelled claims
        env:
          TIS_BENCH_INCLUDE_CALIBRATION: '1'
          TIS_PUBLIC_WEAK_CORPUS: /tmp/tis-calibration/hc3_en.jsonl
          TIS_BENCH_RESULTS: /tmp/tis-calibration/unapproved-inference.jsonl
        run: node tests/browser-ai-reference-benchmark.cjs
      - name: Fit weak-label Platt only on calibration, evaluate untouched holdout
        run: |
          python backend/research/calibrate_from_public_claims.py \
            --records /tmp/tis-calibration/unapproved-inference.jsonl \
            --output /tmp/tis-calibration/diagnostics.json \
            --model-revision b9aa251e5bcda7e429fcc936767d921435945b60 \
            --benchmark HC3_PUBLIC_WEAK_LABELS
      - name: Publish statistical report only, no texts or individual predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UNAPPROVED-weak-label-calibration-evaluation
          path: /tmp/tis-calibration/diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
