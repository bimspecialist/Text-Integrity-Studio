name: External 2026 document-domain detector audit (research only)
on:
  pull_request:
    paths:
      - 'backend/research/build_textsight_benchmark.py'
      - 'backend/research/evaluate_model_outputs.py'
      - 'tests/browser-ai-reference-benchmark.cjs'
      - 'tests/test_external_benchmark.py'
      - 'backend/research/dataset_manifest.py'
      - 'backend/research/cohort_split.py'
      - 'backend/research/selective_metrics.py'
      - 'backend/research/calibration_validation.py'
      - 'backend/research/release_decision.py'
      - 'backend/research/audit_artifact_guard.py'
      - 'tests/test_research_release_decision.py'
      - 'tests/test_research_artifact_publication.py'
      - 'backend/research/RELEASE_TEST_PROTOCOL.md'
      - '.github/workflows/external-detector-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-public-source-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source-provenance selection and per-domain metrics
        run: |
          python -m unittest discover -s tests -p 'test_external_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_detector_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_dataset_manifest.py' -v
          python -m unittest discover -s tests -p 'test_cohort_split.py' -v
          python -m unittest discover -s tests -p 'test_selective_metrics.py' -v
          python -m unittest discover -s tests -p 'test_calibration_validation.py' -v
          python -m unittest discover -s tests -p 'test_research_release_decision.py' -v
          python -m unittest discover -s tests -p 'test_research_artifact_publication.py' -v
          node --check tests/browser-ai-reference-benchmark.cjs
      - name: Install lightweight public-dataset and headless-browser dependencies
        run: |
          python -m pip install 'huggingface_hub>=0.35,<2'
          npm install --no-save --no-package-lock --ignore-scripts --save-exact puppeteer-core@25.13.0
      - name: Freeze provenance and sample public pre-ChatGPT vs current LLM texts
        run: |
          python backend/research/build_textsight_benchmark.py \
            --out /tmp/tis-external2026 \
            --human-per-domain 32 \
            --ai-per-family 8
      - name: Run actual frozen browser ONNX model on 2026 research source cohort
        env:
          TIS_BENCH_CORPUS_MODE: 'external-2026'
          TIS_PUBLIC_WEAK_CORPUS: /tmp/tis-external2026/external-source-eval-private.jsonl
          TIS_BENCH_RESULTS: /tmp/tis-external2026/unapproved-model-predictions.jsonl
        run: node tests/browser-ai-reference-benchmark.cjs
      - name: Report external false-positive, calibration and generator-specific detection statistics
        run: |
          python backend/research/evaluate_model_outputs.py \
            --samples /tmp/tis-external2026/unapproved-model-predictions.jsonl \
            --output /tmp/tis-external2026/research-metrics.json \
            --benchmark TEXTSIGHT_2026_EXTERNAL_VENDOR_BENCHMARK \
            --model-revision b9aa251e5bcda7e429fcc936767d921435945b60
      - name: Block non-aggregate artifacts and independent-ground-truth claims
        run: |
          python backend/research/audit_artifact_guard.py \
            --manifest /tmp/tis-external2026/source-manifest.json \
            --metrics /tmp/tis-external2026/research-metrics.json \
            --output /tmp/tis-external2026/release-status.json
          python -c "import json; from pathlib import Path; x=json.loads(Path('/tmp/tis-external2026/release-status.json').read_text()); assert x['decision']=='BLOCKED' and x['public_probability_enabled'] is False"
      - name: Keep only VALIDATED aggregate research evidence; never upload on failed privacy gate
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RESEARCH-ONLY-external-2026-AI-detector-evaluation
          path: |
            /tmp/tis-external2026/research-metrics.json
            /tmp/tis-external2026/source-manifest.json
            /tmp/tis-external2026/release-status.json
          retention-days: 7
          if-no-files-found: ignore
